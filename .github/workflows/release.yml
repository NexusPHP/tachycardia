name: release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build:
    name: Create a release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release
        uses: crazy-max/ghaction-github-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          name: Nexus Tachycardia ${{ github.ref_name }}
          draft: true
          prerelease: false
