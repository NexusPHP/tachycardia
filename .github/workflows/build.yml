name: build

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - 2.x
  pull_request:
    branches:
      - 2.x

permissions:
  contents: read
  actions: write

jobs:
  main:
    name: Build [PHP ${{ matrix.php-version }}][PHPUnit ${{ matrix.phpunit-version }}]
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        phpunit-version:
          - '^10.5'
        php-version:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
        include:
          - phpunit-version: '^11.0'
            php-version: '8.2'
          - phpunit-version: '^11.0'
            php-version: '8.3'
          - phpunit-version: '^11.0'
            php-version: '8.4'
          - phpunit-version: '^12.0'
            php-version: '8.3'
          - phpunit-version: '^12.2'
            php-version: '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version}}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version}}
          extensions: xdebug
          coverage: xdebug

      - name: Get composer cache directory
        id: composer-cache
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.COMPOSER_CACHE_FILES_DIR }}
          key: composer-php_${{ matrix.php-version }}-phpunit_${{ matrix.phpunit-version }}-${{ hashFiles('**/composer.*') }}
          restore-keys: |
            composer-php_${{ matrix.php-version }}-phpunit_${{ matrix.phpunit-version }}-
            composer-php_${{ matrix.php-version }}-
            composer-

      - name: Setup Composer's GitHub OAuth access
        run: composer config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          composer require --ansi "phpunit/phpunit:${{ matrix.phpunit-version }}" --with-all-dependencies
          composer update --ansi

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer check --ansi --verbose --diff

      - name: Run PHPStan Static Analysis Check
        run: vendor/bin/phpstan analyse --ansi

      - name: Tests on PHPUnit ${{ matrix.phpunit-version }}
        run: |
          vendor/bin/phpunit --color=always
        env:
          TACHYCARDIA_MONITOR_GA: enabled

      - name: Run Coveralls
        run: |
          composer global require --ansi php-coveralls/php-coveralls
          php-coveralls --coverage_clover=build/logs/clover.xml --verbose
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_PARALLEL: true
          COVERALLS_FLAG_NAME: PHP ${{ matrix.php-version }} - PHPUnit ${{ matrix.phpunit-version }}

  coveralls-finish:
    name: Coveralls Finished
    needs:
      - main
    runs-on: ubuntu-24.04

    steps:
      - name: Upload to Coveralls API
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
